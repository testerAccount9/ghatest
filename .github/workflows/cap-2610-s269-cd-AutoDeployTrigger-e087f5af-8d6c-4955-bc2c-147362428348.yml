name: Trigger auto deployment for cap-2610-s269-cd

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ testbranch11 ]
    paths:
    - '**'
    - '.github/workflows/cap-2610-s269-cd-AutoDeployTrigger-e087f5af-8d6c-4955-bc2c-147362428348.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.CAP2610S269CD_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.CAP2610S269CD_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.CAP2610S269CD_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          _dockerfilePathKey_: _dockerfilePath_
          _targetLabelKey_: _targetLabel_
          registryUrl: acaregistry.azurecr.io
          registryUsername: ${{ secrets.CAP2610S269CD_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.CAP2610S269CD_REGISTRY_PASSWORD }}
          containerAppName: cap-2610-s269-cd
          resourceGroup: rg1-2610-s269
          imageToBuild: acaregistry.azurecr.io/cap-2610-s269-cd:${{ github.sha }}
          _buildArgumentsKey_: |
            _buildArgumentsValues_


